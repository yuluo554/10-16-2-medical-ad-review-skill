name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # CI 是 cp1252/cp936 管道：编码守卫的第一层（覆盖全部步骤）
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONDONTWRITEBYTECODE: "1"

# 默认零权限，按需在 job 内抬升（本仓只有读代码的需求）
permissions:
  contents: read

# 同一 ref 的新推送取消旧 run：省额度，且不会让"旧提交的绿"盖住"新提交的红"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      # fetch-depth: 0——脱敏审计器的提交元数据/全历史扫描需要完整历史
      # （浅克隆下审计器显式报 INCOMPLETE 而非静默空扫，check_workflows.py 守此配置）。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # 安装面与 README 快速开始**同一 extras 集合**（测试面 = 安装面）
      - name: Install (README path)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

      # 裸 console script 冒烟：`python -m` 与裸 `<pkg>` 是两条通路，
      # 只跑前者会漏掉"我们的包没进安装面"这类缺陷（安装面第四面）。
      - name: CLI smoke (bare console script)
        run: medreview selftest

      - name: CLI smoke (module form, non-root CWD)
        run: python -m medreview.cli --help

      # 冻结产物位级一致守门（数据非代码）
      - name: Frozen regeneration check
        run: |
          python tools/gen_ruleset.py --check
          python tools/gen_cases.py --check

      # 基准四套件（退出码 0 达标 / 1 未达标 / 2 用法错误）
      - name: Benchmarks
        run: medreview bench

      # 脱敏审计（M6 固化形态：五步扫描 + 提交元数据邮箱；命中即红）
      - name: Desensitize audit
        run: python tools/audit_repo.py

      # 发布打包确定性（同 rev 两次构建逐字节一致 + 打包面 = git 跟踪面）
      - name: Release pack determinism gate
        run: python -m pytest tests/test_m6_release.py -q

      # README ↔ pyproject ↔ 测试 三面对账 + 包布局（第五面）
      - name: README/packaging consistency gate
        run: python -m pytest tests/test_readme_gate.py -q

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      # CI YAML 里"步骤名带冒号+空格且未加引号"会让整个 workflow 失效
      # （GitHub 建 0 个 job，run 0 秒失败而 state 仍显示 active）——本步守门。
      - run: python tests/check_workflows.py
